<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Menu PDF Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 16px; background: #f5f5f5; }
  h1 { color: #2e7d32; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  label { font-weight: bold; display: block; margin-top: 10px; }
  select, input[type=text] { padding: 6px; margin-top: 4px; width: 100%; max-width: 320px; box-sizing: border-box; }
  .hint { color: gray; font-size: 12px; }
  button { background: #2e7d32; color: #fff; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; margin: 8px 8px 0 0; font-size: 14px; }
  button.secondary { background: #616161; }
  button:disabled { background: #aaa; }
  #preview, #status { background: #eef6ee; border: 1px solid #c5e1c5; border-radius: 5px; padding: 10px; margin-top: 12px; white-space: pre-wrap; font-size: 13px; }
  .tabs button { background: #c8e6c9; color: #111; }
  .tabs button.active { background: #2e7d32; color: #fff; }
  table.menu { border-collapse: collapse; width: 100%; margin-top: 6px; }
  table.menu th, table.menu td { border: 1px solid #bbb; padding: 2px; }
  table.menu th { background: #8FBF6B; font-size: 12px; }
  table.menu input { width: 100%; box-sizing: border-box; border: none; padding: 4px; font-size: 12px; }
  table.menu input:focus { outline: 2px solid #2e7d32; }
  .sec-title { width: 100%; box-sizing: border-box; margin-top: 10px; font-weight: bold; background: #FFE7A8; border: 1px solid #bbb; padding: 5px; }
  h3 { margin-bottom: 2px; }
</style>
</head>
<body>
<h1>Monthly Menu PDF Generator</h1>

<div class="card">
  <h2>1. Generate PDF</h2>
  <label>Month</label><select id="month"></select>
  <label>Year</label><select id="year"></select>
  <label>Holidays (dates)</label>
  <input type="text" id="holidays" placeholder="e.g. 12, 13, 19, 20">
  <div class="hint">Day numbers separated by commas. Days before the 1st stay blank (no menu, no HOLIDAY).</div>
  <label><input type="checkbox" id="secondSat" style="width:auto"> Second Saturday is a holiday</label>
  <div id="preview"></div>
  <button id="genBtn" onclick="generatePDF()">Generate &amp; Download PDF</button>
  <div id="status"></div>
</div>

<div class="card">
  <h2>2. Edit Menu (stored in Supabase)</h2>
  <div class="tabs" id="weekTabs"></div>
  <div id="editor"></div>
  <button onclick="saveMenu()">Save to Cloud</button>
  <button class="secondary" onclick="document.getElementById('importFile').click()">Import menu.xlsx</button>
  <input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="importXLSX(event)">
  <button class="secondary" onclick="exportXLSX()">Export menu.xlsx</button>
  <div id="editStatus"></div>
</div>

<script>
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
let MENU = null;      // {week1: {sections:[..], breakfast:[[6]x4], snack:[[6]], lunch:[[6]x10]}, ...}
let ACTIVE_WEEK = "week1";

// ---------- calendar logic (mirrors the Python app) ----------
function mondayWeeks(year, month1) {  // month1 = 1..12
  const first = new Date(year, month1 - 1, 1);
  const last = new Date(year, month1, 0);
  let monday = new Date(first);
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7)); // Monday on/before 1st
  const sat = new Date(monday); sat.setDate(sat.getDate() + 5);
  if (sat < first) monday.setDate(monday.getDate() + 7);           // 1st is a Sunday
  const weeks = [];
  while (monday <= last) {
    const w = [];
    for (let i = 0; i < 6; i++) { const d = new Date(monday); d.setDate(d.getDate() + i); w.push(d); }
    weeks.push(w);
    monday.setDate(monday.getDate() + 7);
  }
  return weeks;
}
function sheetForWeek(i) { return "week" + ((i % 5) + 1); }
function secondSaturday(year, month1) {
  const res = [];
  const last = new Date(year, month1, 0).getDate();
  for (let d = 1; d <= last; d++) { const dt = new Date(year, month1 - 1, d); if (dt.getDay() === 6) res.push(dt); }
  return res.length >= 2 ? res[1] : null;
}
function parseHolidays(text, year, month1) {
  const last = new Date(year, month1, 0).getDate();
  const days = new Set(), bad = [];
  text.replace(/;/g, ",").split(",").forEach(tok => {
    tok = tok.trim(); if (!tok) return;
    let day = /^\d+$/.test(tok) ? parseInt(tok) : null;
    if (day === null) { const m = tok.split(/[\/\-.]/); if (m.length && /^\d+$/.test(m[0].trim())) day = parseInt(m[0].trim()); }
    if (day === null || day < 1 || day > last) bad.push(tok); else days.add(day);
  });
  return { days, bad };
}
const key = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fmtD = d => d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();

// ---------- generate tab ----------
function initSelectors() {
  const now = new Date();
  const ms = document.getElementById("month"), ys = document.getElementById("year");
  MONTH_NAMES.forEach((m, i) => { const o = document.createElement("option"); o.value = i + 1; o.text = m; ms.add(o); });
  ms.value = now.getMonth() + 1;
  for (let y = now.getFullYear() - 2; y <= now.getFullYear() + 9; y++) { const o = document.createElement("option"); o.value = y; o.text = y; ys.add(o); }
  ys.value = now.getFullYear();
  ["month","year","holidays","secondSat"].forEach(id =>
    document.getElementById(id).addEventListener("change", refreshPreview));
  document.getElementById("holidays").addEventListener("input", refreshPreview);
  refreshPreview();
}
function currentHolidays() {
  const m = +document.getElementById("month").value, y = +document.getElementById("year").value;
  const { days, bad } = parseHolidays(document.getElementById("holidays").value, y, m);
  const set = new Set([...days].map(d => key(new Date(y, m - 1, d))));
  if (document.getElementById("secondSat").checked) { const ss = secondSaturday(y, m); if (ss) set.add(key(ss)); }
  return { set, bad, m, y };
}
function refreshPreview() {
  const { set, bad, m, y } = currentHolidays();
  const lines = mondayWeeks(y, m).map((w, i) => {
    const r = w[0].getDate() + " " + w[0].toLocaleString("en", {month:"short"}) + "-" + w[w.length-1].getDate() + " " + w[w.length-1].toLocaleString("en", {month:"short"});
    const pad = w[0].getMonth() + 1 !== m ? " (blank before the 1st)" : "";
    const h = w.filter(d => set.has(key(d))).map(d => d.getDate() + "*").join(",");
    return "Week " + (i+1) + " (" + sheetForWeek(i) + "): " + r + pad + (h ? "  holidays: " + h : "");
  });
  if (bad.length) lines.push("Ignored (invalid): " + bad.join(", "));
  document.getElementById("preview").textContent = lines.join("\n");
}
async function generatePDF() {
  const { set, bad, m, y } = currentHolidays();
  if (bad.length && !confirm("Invalid entries: " + bad.join(", ") + "\nContinue anyway?")) return;
  const btn = document.getElementById("genBtn");
  btn.disabled = true;
  document.getElementById("status").textContent = "Generating...";
  try {
    const resp = await fetch("/api/generate", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ year: y, month: m,
        holidays: [...set], secondSaturday: document.getElementById("secondSat").checked })
    });
    if (!resp.ok) throw new Error(await resp.text());
    const blob = await resp.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = MONTH_NAMES[m-1] + " " + y + " Menu.pdf";
    a.click();
    document.getElementById("status").textContent = "Downloaded!";
  } catch (e) { document.getElementById("status").textContent = "Error: " + e.message; }
  btn.disabled = false;
}

// ---------- editor tab ----------
function blankWeek() {
  const rows = n => Array.from({length: n}, () => Array(6).fill(""));
  return { sections: ["Breakfast : 8:10 am to 8:30 am", "Snacks: 10:00 am to 10:10 am", "Lunch: 12:30 pm to 01:10 pm"],
           breakfast: rows(4), snack: rows(1), lunch: rows(10) };
}
function blankMenu() { const o = {}; for (let i = 1; i <= 5; i++) o["week" + i] = blankWeek(); return o; }
async function loadMenu() {
  try {
    const r = await fetch("/api/menu");
    const j = await r.json();
    MENU = j.menu || blankMenu();
    if (!j.menu) document.getElementById("editStatus").textContent = "Cloud menu is empty — Import menu.xlsx, then Save.";
  } catch (e) { MENU = blankMenu(); document.getElementById("editStatus").textContent = "Could not load cloud menu: " + e.message; }
  renderTabs(); renderEditor();
}
function renderTabs() {
  const t = document.getElementById("weekTabs"); t.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.textContent = "week" + i; if ("week"+i === ACTIVE_WEEK) b.className = "active";
    b.onclick = () => { ACTIVE_WEEK = "week" + i; renderTabs(); renderEditor(); };
    t.appendChild(b);
  }
}
function blockHTML(title, secIdx, rows) {
  let h = "<h3>" + title + "</h3><input class='sec-title' data-sec='" + secIdx + "' value=\"" + esc(MENU[ACTIVE_WEEK].sections[secIdx]) + "\">";
  h += "<table class='menu'><tr>" + DAY_NAMES.map(d => "<th>" + d + "</th>").join("") + "</tr>";
  rows.forEach((row, r) => { h += "<tr>" + row.map((v, c) => "<td><input data-b='" + title + "' data-r='" + r + "' data-c='" + c + "' value=\"" + esc(v) + "\"></td>").join("") + "</tr>"; });
  return h + "</table>";
}
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
function renderEditor() {
  const w = MENU[ACTIVE_WEEK];
  document.getElementById("editor").innerHTML =
    blockHTML("breakfast", 0, w.breakfast) + blockHTML("snack", 1, w.snack) + blockHTML("lunch", 2, w.lunch);
}
function readEditor() {
  const w = MENU[ACTIVE_WEEK];
  document.querySelectorAll("#editor input.sec-title").forEach(el => { w.sections[+el.dataset.sec] = el.value; });
  document.querySelectorAll("#editor table.menu input").forEach(el => { w[el.dataset.b][+el.dataset.r][+el.dataset.c] = el.value; });
}
async function saveMenu() {
  readEditor();
  document.getElementById("editStatus").textContent = "Saving...";
  try {
    const r = await fetch("/api/menu", { method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ menu: MENU }) });
    if (!r.ok) throw new Error(await r.text());
    document.getElementById("editStatus").textContent = "Saved to cloud.";
  } catch (e) { document.getElementById("editStatus").textContent = "Error: " + e.message; }
}
// Import: read sheets week1..5, rows mirroring the desktop app layout
function importXLSX(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: "array" });
      const M = blankMenu();
      for (let i = 1; i <= 5; i++) {
        const sh = wb.Sheets["week" + i] || wb.Sheets["Week" + i] || wb.Sheets[wb.SheetNames[i-1]];
        if (!sh) continue;
        const a = XLSX.utils.sheet_to_json(sh, { header: 1, defval: "" });
        const cell = (r, c) => ((a[r] && a[r][c]) || "").toString().trim();
        const w = M["week" + i];
        w.sections = [cell(3,0), cell(8,0), cell(10,0)];
        for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) w.breakfast[r][c] = clean(cell(4+r, c));
        for (let c = 0; c < 6; c++) w.snack[0][c] = clean(cell(9, c));
        for (let r = 0; r < 10; r++) for (let c = 0; c < 6; c++) w.lunch[r][c] = clean(cell(11+r, c));
      }
      readEditor(); MENU = M; renderEditor();
      document.getElementById("editStatus").textContent = "Imported from file — press Save to Cloud.";
    } catch (err) { document.getElementById("editStatus").textContent = "Import error: " + err.message; }
  };
  rd.readAsArrayBuffer(f); ev.target.value = "";
}
function clean(v) { return v.toUpperCase() === "HOLIDAY" ? "" : v; }
function exportXLSX() {
  readEditor();
  const wb = XLSX.utils.book_new();
  for (let i = 1; i <= 5; i++) {
    const w = MENU["week" + i], a = [];
    a.push(["MENU"]); a.push(DAY_NAMES); a.push([]);
    a.push([w.sections[0]]);
    w.breakfast.forEach(r => a.push(r));
    a.push([w.sections[1]]); a.push(w.snack[0]); a.push([w.sections[2]]);
    w.lunch.forEach(r => a.push(r));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a), "week" + i);
  }
  XLSX.writeFile(wb, "menu.xlsx");
}
initSelectors(); loadMenu();
</script>
</body>
</html>
